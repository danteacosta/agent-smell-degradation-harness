<!doctype html><html><head><meta charset="utf-8"><title>Meal planner rule</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:1rem}button,input,select{font:inherit;padding:.4rem}label{display:block;margin:.5rem 0}li{margin:.3rem 0}[role=status]{min-height:1.2em}</style></head>
<body><main><h1>Meal planner rule</h1><p id="rule"></p><button id="preview" type="button">Preview recipe pool</button><ul id="pool" aria-label="Recipe pool"></ul></main><script>
const storageKey='mealie-planner-food-label';
let behavior=null;
function register(handler){if(typeof handler!=='function'||behavior)throw new Error('invalid handler');behavior=handler}
function load(initial){const raw=localStorage.getItem(storageKey);if(raw===null){localStorage.setItem(storageKey,JSON.stringify(initial));return structuredClone(initial)}return JSON.parse(raw)}
function store(value){localStorage.setItem(storageKey,JSON.stringify(value))}
function el(tag,attrs={},text=''){const node=document.createElement(tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,String(v));if(text)node.textContent=text;return node}
let pool=[];
const app=Object.freeze({
  onPreview:register,
  rule(){return structuredClone(window.initialState.rule)},
  recipes(){return structuredClone(window.initialState.recipes)},
  showPool(ids){if(!Array.isArray(ids)||!ids.every(id=>window.initialState.recipes.some(r=>r.id===id)))throw new Error('recipe ids required');pool=[...ids];render()}
});
function render(){const r=window.initialState.rule;document.querySelector('#rule').textContent='Rule: ingredient is '+r.value;
  const list=document.querySelector('#pool');list.replaceChildren();
  for(const id of pool)list.append(el('li',{'data-id':id},window.initialState.recipes.find(x=>x.id===id).name))}
document.querySelector('#preview').addEventListener('click',()=>{if(behavior)behavior(app.rule(),app.recipes())});
render();
/* MODEL_BEHAVIOR */
</script></body></html>
