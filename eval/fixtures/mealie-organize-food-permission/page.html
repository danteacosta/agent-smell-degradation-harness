<!doctype html><html><head><meta charset="utf-8"><title>Foods</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:1rem}button,input,select{font:inherit;padding:.4rem}label{display:block;margin:.5rem 0}li{margin:.3rem 0}[role=status]{min-height:1.2em}</style></head>
<body><main><h1>Foods</h1><p id="signed-in"></p><ul id="foods" aria-label="Foods"></ul><label>New food <input id="food-name"></label><button id="add-food" type="button">Add food</button><p id="message" role="status"></p></main><script>
const storageKey='mealie-organize-food-permission';
let behavior=null;
function register(handler){if(typeof handler!=='function'||behavior)throw new Error('invalid handler');behavior=handler}
function load(initial){const raw=localStorage.getItem(storageKey);if(raw===null){localStorage.setItem(storageKey,JSON.stringify(initial));return structuredClone(initial)}return JSON.parse(raw)}
function store(value){localStorage.setItem(storageKey,JSON.stringify(value))}
function el(tag,attrs={},text=''){const node=document.createElement(tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,String(v));if(text)node.textContent=text;return node}
let foods=load(window.initialState.foods);
const app=Object.freeze({
  onAdd:register,
  user(){return structuredClone(window.initialState.user)},
  foods(){return structuredClone(foods)},
  createFood(name){if(typeof name!=='string'||!name.trim())throw new Error('food name required');foods.push(name.trim());store(foods);render()},
  showMessage(text){document.querySelector('#message').textContent=String(text)}
});
function render(){document.querySelector('#signed-in').textContent='Signed in as '+window.initialState.user.username;
  const list=document.querySelector('#foods');list.replaceChildren();for(const f of foods)list.append(el('li',{'data-food':f},f))}
document.querySelector('#add-food').addEventListener('click',()=>{if(behavior)behavior(document.querySelector('#food-name').value)});
render();
/* MODEL_BEHAVIOR */
</script></body></html>
