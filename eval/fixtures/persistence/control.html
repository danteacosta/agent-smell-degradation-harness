<!doctype html><meta charset="utf-8"><meta name="qualification-mode" content="MODE"><title>Persistence control</title>
<input class="new-todo" aria-label="New todo"><ul class="todo-list"></ul>
<script>
const mode=document.querySelector('meta[name="qualification-mode"]').content;
const restoresEditing=mode==='restore-edit'||mode==='restore-edit-wrapped-action';
const key='todos-vanilla';
const input=document.querySelector('input.new-todo');
const list=document.querySelector('ul.todo-list');
let todos=[];
const loadedFromStorage=localStorage.getItem(key)!==null;
if(mode!=='no-reload'){
  try{todos=JSON.parse(mode==='encoded-value'
    ? atob(localStorage.getItem(key)||'W10=') : localStorage.getItem(key)||'[]').map(item=>({...item,
    completed:mode==='drop-completed'?false:Boolean(item.completed),
    editing:restoresEditing&&Boolean(item.editing)}));}catch{todos=[];}
}
if(mode==='duplicate-after-reload'&&loadedFromStorage)
  todos=todos.flatMap(item=>[item,{...item}]);
function save(){
  const serialized=JSON.stringify(todos.map(item=>({
    id:item.id,title:item.title,completed:item.completed,
    ...(mode==='false-flag'?{editing:false}:{}),
    ...(restoresEditing?{editing:item.editing}:{})
  })));
  localStorage.setItem(key,mode==='encoded-value'?btoa(serialized):serialized);
}
function render(){
  list.replaceChildren();
  for(const item of todos){
    const row=document.createElement('li');
    if(mode==='hidden-after-reload'&&loadedFromStorage)row.hidden=true;
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=item.completed;
    checkbox.onchange=()=>{item.completed=checkbox.checked;save();render();};
    row.append(checkbox);
    if(mode==='no-edit-button'){
      const action=document.createElement('input');action.type='button';action.value='Details';row.append(action);
    }
    if(item.editing){
      const edit=document.createElement('input');edit.className='edit';edit.value=item.title;
      edit.onkeydown=event=>{if(event.key==='Enter'){item.title=edit.value;item.editing=false;save();render();}};
      row.append(edit);
      if(mode==='restore-edit-wrapped-action'){
        const wrapper=document.createElement('div');
        const action=document.createElement('button');action.textContent='Details';
        wrapper.append(action);row.append(wrapper);
      }
    }else{
      const target=item.title==='persist-target-row';
      let title;
      if(mode==='span-title')title=document.createElement('span');
      else if(mode==='div-title'||mode==='nested-title')title=document.createElement('div');
      else title=document.createElement('label');
      if(mode==='nested-title'){
        const nested=document.createElement('span');nested.textContent=item.title;title.append(nested);
      }else title.textContent=item.title;
      if(target&&mode==='wrapped-control-title'){
        title=document.createElement('div');
        const action=document.createElement('button');
        const output=document.createElement('output');output.textContent=item.title;
        action.append(output);title.append(action);
      }
      if(mode==='mixed-title-wrapped-action'){
        title=document.createElement('div');title.append(item.title.slice(0,7));
        const suffix=document.createElement('span');suffix.textContent=item.title.slice(7);
        const wrapper=document.createElement('div');
        const action=document.createElement('button');action.textContent='Delete';
        wrapper.append(action);title.append(suffix,wrapper);
      }
      let editSurface=title;
      if(target&&mode==='hidden-exact-title'){
        title.hidden=true;
        const visible=document.createElement('label');visible.textContent='unrelated visible title';
        row.append(visible);editSurface=visible;
      }
      if(target&&mode==='accessible-only-title'){
        title.textContent='unrelated visible title';title.setAttribute('aria-label',item.title);
      }
      if(target&&mode==='control-value-title'){
        title.textContent='unrelated visible title';
        const unrelated=document.createElement('input');unrelated.type='text';
        unrelated.className='unrelated-control';unrelated.value=item.title;
        row.append(unrelated);
      }
      if(target&&mode==='substring-title')title.textContent=`prefix-${item.title}-suffix`;
      editSurface.ondblclick=()=>{if(mode==='no-edit'||mode==='no-edit-button')return;item.editing=true;save();render();};
      row.append(title);
      if(target&&mode==='duplicate-titles')row.append(title.cloneNode(true));
    }
    list.append(row);
    if(item.title==='persist-target-row'&&mode==='duplicate-rows')list.append(row.cloneNode(true));
  }
}
input.onkeydown=event=>{
  if(event.key==='Enter'&&input.value.trim()){
    todos.push({id:String(Date.now()),title:input.value.trim(),completed:false,editing:false});
    input.value='';save();render();
  }
};
render();
</script>
