<!doctype html><meta charset="utf-8"><title>Article</title><style>.faded{opacity:0}</style><main id="app"></main><script>
const {viewer,article}=window.initialState;const own=viewer.username===article.author.username;document.querySelector('#app').innerHTML=`<h1>${article.title}</h1><p>${article.body}</p><span rel="author">${article.author.username}</span>${own?'<button class="faded">Delete Article</button>':''}`;
</script>
