<!doctype html><meta charset="utf-8"><title>Article</title><main id="app"></main><script>
const {viewer,article}=window.initialState;const show=viewer.username!==article.author.username;document.querySelector('#app').innerHTML=`<h1>${article.title}</h1><p>${article.body}</p><a rel="author">${article.author.username}</a>${show?'<button>Delete Article</button>':''}`;
</script>
