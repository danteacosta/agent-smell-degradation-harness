<!doctype html><html><head><meta charset="utf-8"><title>Playbook tasks</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:1rem}button,input,select{font:inherit;padding:.4rem}label{display:block;margin:.5rem 0}li{margin:.3rem 0}[role=status]{min-height:1.2em}</style></head>
<body><main><h1>Playbook: <span id="playbook"></span></h1><h2>Tasks</h2><ol id="tasks" aria-label="Checklist"></ol><label>Task <input id="task-text" size="60"></label><button id="add-task" type="button">Add a task</button><p id="message" role="status"></p></main><script>
const storageKey='page-state';
let behavior=null;
function register(handler){if(typeof handler!=='function'||behavior)throw new Error('invalid handler');behavior=handler}
function load(initial){const raw=localStorage.getItem(storageKey);if(raw===null){localStorage.setItem(storageKey,JSON.stringify(initial));return structuredClone(initial)}return JSON.parse(raw)}
function store(value){localStorage.setItem(storageKey,JSON.stringify(value))}
function el(tag,attrs={},text=''){const node=document.createElement(tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,String(v));if(text)node.textContent=text;return node}
let tasks=load([]);
const app=Object.freeze({
  onAdd:register,
  tasks(){return structuredClone(tasks)},
  addTask(task){if(typeof task!=='object'||task===null||typeof task.text!=='string'||!task.text.trim()||typeof task.html!=='string')throw new Error('text and html required');
    tasks.push({text:task.text,html:task.html});store(tasks);render()},
  showMessage(text){document.querySelector('#message').textContent=String(text)}
});
function render(){
  document.querySelector('#playbook').textContent=window.initialState.playbook;
  const list=document.querySelector('#tasks');list.replaceChildren();
  for(const t of tasks){const li=el('li',{'data-text':t.text});const span=el('span',{class:'task-text'});span.innerHTML=t.html;li.append(el('input',{type:'checkbox','aria-label':'Done'}),document.createTextNode(' '),span);list.append(li)}
}
document.querySelector('#add-task').addEventListener('click',()=>{if(behavior)behavior(document.querySelector('#task-text').value)});
render();
/* MODEL_BEHAVIOR */
</script></body></html>
