<!doctype html><html><head><meta charset="utf-8"><title>Profile</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:1rem}a{margin-right:1rem}.article{border:1px solid #bbb;padding:.8rem;margin:.7rem 0}</style></head>
<body><main><h1 id="profile-name"></h1><nav><a id="authored-link" href="/profile/alice">My Articles</a><a id="favorites-link" href="/profile/alice/favorites">Favorites</a></nav><div id="articles"></div></main><script>
const owner='alice';
// app.articles() returns records shaped {id, title, author: {username}, favoritedBy: [username]}.
const articles=structuredClone(window.initialState.articles);
let routeHandler=null;
const app=Object.freeze({
  onRoute(handler){if(typeof handler!=='function'||routeHandler)throw new Error('invalid route handler');routeHandler=handler;handler(location.pathname)},
  articles(){return structuredClone(articles)},
  show(items){if(!Array.isArray(items))throw new Error('articles array required');
    const root=document.querySelector('#articles');root.replaceChildren();
    for(const item of items){if(!articles.some(article=>article.id===item.id))throw new Error('unknown article');
      const row=document.createElement('section');row.className='article';row.dataset.articleId=String(item.id);
      const title=document.createElement('h2');title.textContent=String(item.title??'');row.append(title);root.append(row)}},
});
document.querySelector('#profile-name').textContent=owner;
/* MODEL_BEHAVIOR */
</script></body></html>
