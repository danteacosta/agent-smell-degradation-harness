name: eval-gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Behavioral executor smoke (original controls, no providers)
        run: python -m eval.behavior_runtime_smoke
      - run: python -m eval
      - run: python -m gates
