name: eval-gate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/dependency_bundle.py
      - run: dependency-bundle/runtime/bin/python -m pytest -q
      - name: Private input container boundary (no providers)
        run: |
          docker build -f tests/fixtures/todomvc-custody.Dockerfile --iidfile /tmp/custody-image eval/fixtures
          TODOMVC_BOUNDARY_IMAGE=$(cat /tmp/custody-image) dependency-bundle/runtime/bin/python -m pytest tests/test_todomvc_pilot_executor.py -q
      - name: Behavioral executor smoke (original controls, no providers)
        run: dependency-bundle/runtime/bin/python -m eval.behavior_runtime_smoke
      - run: dependency-bundle/runtime/bin/python -m eval
      - run: dependency-bundle/runtime/bin/python -m gates
