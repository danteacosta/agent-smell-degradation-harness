name: eval-gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"  # nightly full suite, including the slow study tests
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/dependency_bundle.py
      - name: H2 project and source holdout mutation gate (offline)
        run: dependency-bundle/runtime/bin/python scripts/check_split_mutation_gate.py
      - name: H2 pre-final feature boundary mutation gate (offline)
        run: dependency-bundle/runtime/bin/python scripts/check_feature_plane_mutation_gate.py
      - name: Tests (fast suite on pull requests, full suite on main and nightly)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            dependency-bundle/runtime/bin/python -m pytest -q -m "not slow"
          else
            dependency-bundle/runtime/bin/python -m pytest -q
          fi
      - name: Private input container boundary (no providers)
        run: |
          docker build -f tests/fixtures/todomvc-custody.Dockerfile --iidfile /tmp/custody-image eval/fixtures
          TODOMVC_BOUNDARY_IMAGE=$(cat /tmp/custody-image) dependency-bundle/runtime/bin/python -m pytest tests/test_todomvc_pilot_executor.py -q
      - name: Behavioral executor smoke (original controls, no providers)
        run: dependency-bundle/runtime/bin/python -m eval.behavior_runtime_smoke
      - run: dependency-bundle/runtime/bin/python -m eval
      - run: dependency-bundle/runtime/bin/python -m gates
