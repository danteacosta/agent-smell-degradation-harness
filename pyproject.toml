[project]
name = "agent-smell-degradation-harness"
version = "0.1.0"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "agent-reliability-protocol @ git+https://github.com/danteacosta/agent-reliability-protocol.git@v2.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
live = ["openai>=1.0", "anthropic>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "agent_harness*",
  "pairs*",
  "agents*",
  "observability*",
  "feature_plane*",
  "label_plane*",
  "eval*",
  "gates*",
  "taxonomy*",
  "protocol*",
  "protocol_next*",
  "baselines*",
  "mitigation*",
  "wedge*",
  "replay*",
]
